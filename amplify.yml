frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - corepack enable
        - pnpm install --frozen-lockfile
        # bump Node’s heap for the Next.js build
        - export NODE_OPTIONS=--max_old_space_size=4096
    build:
      # make sure this matches your package.json “build” script
      - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*

version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm           
        - corepack enable              
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build               
  artifacts:
    baseDirectory: out                 
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
